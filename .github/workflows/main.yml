# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request events
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linters:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Set node version
    #
    # Pinned to the runtime declared by .nvmrc for this project. It is a hard
    # compatibility constraint rather than a default: every dependency added by
    # the AngularJS-to-React migration was resolved to a release whose engine
    # range admits it, and node-sass builds its native binding against it. CI is
    # the only place that constraint is actually verified, so this value must not
    # be raised to whatever runtime a local machine happens to provide.
    strategy:
      matrix:
        node-version: [16.19.1]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false

    # https://github.com/actions/setup-node/issues/214 workaround npm i by url
    - name: Reconfigure git to use HTTP authentication
      run: >
        git config --global url."https://github.com/".insteadOf
        ssh://git@github.com/

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Node ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm install
      run: npm ci

    - name: pass linters
      run: npm run scss-lint

  unit-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Set node version
    #
    # Same pin as the linters job above, and for the same reason: the type-check
    # and React unit steps added below prove nothing about the required runtime
    # unless they execute on it.
    strategy:
      matrix:
        node-version: [16.19.1]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false

    # https://github.com/actions/setup-node/issues/214 workaround npm i by url
    - name: Reconfigure git to use HTTP authentication
      run: >
        git config --global url."https://github.com/".insteadOf
        ssh://git@github.com/

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Node ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm install
      run: npm ci

    # These two gates cover app/react/ and are browserless: they need neither a
    # built dist/ nor a browser binary, unlike the CoffeeScript unit step below.
    - name: type check
      run: npm run typecheck

    - name: pass react unit test
      run: npm test

    - name: pass unit test
      run: npm run ci:test

